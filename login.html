<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso interno · Curifor</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
  <style>
    :root{
      --navy:#001b6c; --navy-hover:#16309a; --blue:#2a4bd0;
      --tint:#eef2fb; --tint-borde:#d3ddf4; --ink:#14181f; --ink-2:#545d6e; --ink-3:#8a93a3;
      --linea:#e6eaf2; --bg:#f4f6fb; --blanco:#fff;
      --verde:#0a7d43; --verde-bg:#e6f4ec; --rojo:#b42318; --rojo-bg:#fdecec;
      --radio:14px; --radio-sm:9px; --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);
      min-height:100vh;display:grid;place-items:center;padding:24px;border-top:3px solid var(--navy)}
    .card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
      box-shadow:0 12px 30px rgba(0,27,108,.08);width:100%;max-width:420px;padding:30px 30px 34px}
    .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
    /* width:auto es imprescindible: el <img> trae width="704" en el marcado y,
       sin esto, el navegador respeta ese ancho con 30px de alto y aplasta el
       logo. Mismo criterio que .brand__logo en estilos.css. */
    .brand img{height:30px;width:auto;display:block}
    .brand span{font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--ink-2);text-transform:uppercase}
    h1{font-size:20px;font-weight:800;color:var(--navy);text-align:center;margin:14px 0 4px}
    .sub{font-size:13.5px;color:var(--ink-2);text-align:center;margin:0 0 20px}
    .tabs{display:flex;gap:6px;background:var(--tint);border-radius:var(--radio-sm);padding:4px;margin-bottom:18px}
    .tab{flex:1;border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:var(--ink-2);
      padding:9px;border-radius:6px;cursor:pointer}
    .tab.is-on{background:var(--blanco);color:var(--navy);box-shadow:0 1px 4px rgba(0,27,108,.1)}
    label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
    input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--blanco);
      border:1.5px solid var(--tint-borde);border-radius:var(--radio-sm);padding:12px 13px;margin-bottom:14px}
    input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,75,208,.15)}
    .btn{width:100%;border:0;border-radius:var(--radio-sm);background:var(--navy);color:#fff;
      font:inherit;font-weight:700;font-size:15px;padding:13px;cursor:pointer;box-shadow:0 8px 18px rgba(0,27,108,.22)}
    .btn:hover{background:var(--navy-hover)}
    .btn:disabled{background:var(--tint-borde);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
    .msg{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:var(--radio-sm);margin:0 0 14px;border:1px solid transparent}
    .msg--err{color:var(--rojo);background:var(--rojo-bg);border-color:rgba(180,35,24,.25)}
    .msg--ok{color:var(--verde);background:var(--verde-bg);border-color:rgba(10,125,67,.25)}
    .hint{font-size:12px;color:var(--ink-3);margin:-8px 0 14px}
    .pie{font-size:12px;color:var(--ink-3);text-align:center;margin:18px 0 0}
    .pie a{color:var(--blue);text-decoration:none;font-weight:600}
    .pie a:hover{text-decoration:underline}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="img/curifor-logo.png" alt="Curifor" width="704" height="158">
      <span>Servicio y Postventa</span>
    </div>
    <h1 id="titulo">Acceso interno</h1>
    <p class="sub">Plataforma de mantenciones y taller — solo personal Curifor.</p>

    <div class="tabs" role="tablist">
      <button class="tab is-on" id="tabEntrar" type="button">Entrar</button>
      <button class="tab" id="tabCrear" type="button">Crear cuenta</button>
    </div>

    <p id="msg" class="msg" hidden></p>

    <!-- Entrar -->
    <form id="formEntrar" novalidate>
      <label>Correo Curifor</label>
      <input id="inEmail" type="email" autocomplete="email" placeholder="nombre@curifor.com">
      <label>Contraseña</label>
      <input id="inPass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="btnEntrar" type="submit">Entrar</button>
    </form>

    <!-- Crear cuenta -->
    <form id="formCrear" novalidate hidden>
      <label>Nombre y apellido</label>
      <input id="crNombre" type="text" autocomplete="name" placeholder="Tu nombre">
      <label>Correo Curifor</label>
      <input id="crEmail" type="email" autocomplete="email" placeholder="nombre@curifor.com">
      <p class="hint">Debe ser tu correo <b>@curifor.com</b>. La cuenta queda lista al instante, sin correo de confirmación.</p>
      <label>Contraseña</label>
      <input id="crPass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
      <button class="btn" id="btnCrear" type="submit">Crear cuenta</button>
    </form>

    <p class="pie">¿Problemas para entrar? Escribe a <a href="mailto:icalderon@curifor.com">icalderon@curifor.com</a></p>
  </main>

  <script src="js/agenda-config.js?v=229a43e"></script>
  <script src="js/auth.js?v=229a43e"></script>
  <script>
  (function () {
    var A = window.CURIFOR_AUTH;
    var params = new URLSearchParams(location.search);
    var next = params.get("next") || "index.html";
    // evita bucles: nunca volver al propio login
    if (/login\.html/i.test(next)) next = "index.html";

    // si ya hay sesión válida, entra directo
    if (A && A.cfgOk()) {
      A.sesion().then(function (s) { if (s) location.replace(next); });
    }

    var msg = document.getElementById("msg");
    function showMsg(txt, tipo) {
      msg.className = "msg msg--" + tipo;
      msg.textContent = txt;
      msg.hidden = false;
    }
    function clearMsg() { msg.hidden = true; }

    // tabs
    var tabE = document.getElementById("tabEntrar"), tabC = document.getElementById("tabCrear");
    var formE = document.getElementById("formEntrar"), formC = document.getElementById("formCrear");
    function verTab(entrar) {
      tabE.classList.toggle("is-on", entrar); tabC.classList.toggle("is-on", !entrar);
      formE.hidden = !entrar; formC.hidden = entrar; clearMsg();
    }
    tabE.addEventListener("click", function () { verTab(true); });
    tabC.addEventListener("click", function () { verTab(false); });

    if (!A || !A.cfgOk()) {
      showMsg("El acceso aún no está configurado en esta instalación. Avisa a Sistemas.", "err");
    }

    // Entrar
    formE.addEventListener("submit", function (e) {
      e.preventDefault(); clearMsg();
      var email = document.getElementById("inEmail").value.trim();
      var pass = document.getElementById("inPass").value;
      if (!email || !pass) return showMsg("Ingresa tu correo y contraseña.", "err");
      var btn = document.getElementById("btnEntrar");
      btn.disabled = true; btn.textContent = "Entrando…";
      A.login(email, pass).then(function () {
        location.replace(next);
      }).catch(function (err) {
        var m = (err && (err.error_description || err.msg || err.message)) || "";
        // La confirmación por correo está apagada, pero el mensaje se conserva
        // por si alguien la reactiva: sin esto, una cuenta sin confirmar se
        // reportaría como "clave incorrecta" y se buscaría el problema donde no
        // está.
        if (/confirm/i.test(m)) showMsg("Tu cuenta está sin confirmar. Avisa a Sistemas.", "err");
        else showMsg("Correo o contraseña incorrectos.", "err");
        btn.disabled = false; btn.textContent = "Entrar";
      });
    });

    // Crear cuenta
    formC.addEventListener("submit", function (e) {
      e.preventDefault(); clearMsg();
      var nombre = document.getElementById("crNombre").value.trim();
      var email = document.getElementById("crEmail").value.trim();
      var pass = document.getElementById("crPass").value;
      if (nombre.length < 3) return showMsg("Escribe tu nombre y apellido.", "err");
      if (!A.dominioOk(email)) return showMsg("Debe ser un correo " + A.dominio + ".", "err");
      if (pass.length < 8) return showMsg("La contraseña debe tener al menos 8 caracteres.", "err");
      var btn = document.getElementById("btnCrear");
      btn.disabled = true; btn.textContent = "Creando…";
      // La confirmación por correo está apagada en Supabase: la cuenta queda
      // usable de inmediato, así que se entra directo en vez de mandar a la
      // persona a revisar un correo que no va a llegar.
      A.registrar(nombre, email, pass).then(function () {
        return A.login(email, pass)
          .then(function () { location.replace(next); })
          .catch(function () {
            formC.reset();
            showMsg("¡Cuenta creada! Ya puedes entrar con tu correo y tu clave.", "ok");
            btn.disabled = false; btn.textContent = "Crear cuenta";
            verTab(true);
          });
      }).catch(function (err) {
        var m = (err && (err.error_description || err.msg || err.message || err.error)) || "";
        if (/registered|already/i.test(m)) showMsg("Ese correo ya tiene una cuenta. Usa 'Entrar'.", "err");
        else showMsg("No se pudo crear la cuenta: " + (m || "inténtalo de nuevo."), "err");
        btn.disabled = false; btn.textContent = "Crear cuenta";
      });
    });
  })();
  </script>
</body>
</html>
