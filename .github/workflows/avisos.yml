# Envía los correos de la agenda al cliente.
#
# Corre acá y no en Supabase porque las Edge Functions no pueden salir por el
# puerto 587, que es el único que tiene abierto el servidor de correo.
#
# Se dispara de tres formas:
#   · repository_dispatch -> la base avisa al crear una reserva (~30 s)
#   · schedule            -> cada 15 min, para los recordatorios
#   · workflow_dispatch   -> a mano, desde la pestaña Actions
name: Avisos de agenda

on:
  repository_dispatch:
    types: [aviso_nuevo]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal = envia los correos; diagnostico = solo cuenta lo que saldria'
        type: choice
        options: [normal, diagnostico, prueba, encender, apagar]
        default: normal
      destino:
        description: 'solo para modo prueba: a que correo mandarla'
        type: string
        default: ''

# Si entran dos disparos juntos (el inmediato y el del reloj), se ejecuta uno
# después del otro en vez de en paralelo. La base ya impide el correo repetido,
# pero esto evita el forcejeo.
concurrency:
  group: avisos-agenda
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sin dependencias: el script usa solo la biblioteca estándar.
      - name: Enviar avisos pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: Curifor Servicio y Postventa
          MODO: ${{ github.event.inputs.modo || 'normal' }}
          DESTINO: ${{ github.event.inputs.destino }}
        run: python herramientas/enviar_avisos.py
