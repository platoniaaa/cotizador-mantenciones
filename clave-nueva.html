<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Define tu contraseña · Curifor</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
  <style>
    :root{
      --navy:#001b6c; --navy-hover:#16309a;
      --tint:#eef2fb; --tint-borde:#d3ddf4; --ink:#14181f; --ink-2:#545d6e; --ink-3:#8a93a3;
      --linea:#e6eaf2; --bg:#f4f6fb; --blanco:#fff;
      --verde:#0a7d43; --verde-bg:#e6f4ec; --rojo:#b42318; --rojo-bg:#fdecec;
      --radio:14px; --radio-sm:9px; --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);
      min-height:100vh;display:grid;place-items:center;padding:24px;border-top:3px solid var(--navy)}
    .card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
      box-shadow:0 12px 30px rgba(0,27,108,.08);width:100%;max-width:420px;padding:30px 30px 34px}
    .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
    .brand img{height:30px;width:auto;display:block}
    .brand span{font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--ink-2);text-transform:uppercase}
    h1{font-size:20px;font-weight:800;color:var(--navy);text-align:center;margin:14px 0 4px}
    .sub{font-size:13.5px;color:var(--ink-2);text-align:center;margin:0 0 20px}
    label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
    input[type="password"]{width:100%;padding:11px 12px;border:1px solid var(--tint-borde);
      border-radius:var(--radio-sm);font:15px var(--font);color:var(--ink);background:#fff;margin-bottom:14px}
    input[type="password"]:focus{outline:none;border-color:var(--navy)}
    .btn{width:100%;border:0;border-radius:var(--radio-sm);background:var(--navy);color:#fff;
      font:700 15px var(--font);padding:13px;cursor:pointer}
    .btn:hover:not(:disabled){background:var(--navy-hover)}
    .btn:disabled{background:var(--tint-borde);color:var(--ink-3);cursor:not-allowed}
    .msg{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:var(--radio-sm);
      margin:0 0 14px;border:1px solid transparent}
    .msg--err{color:var(--rojo);background:var(--rojo-bg);border-color:rgba(180,35,24,.25)}
    .msg--ok{color:var(--verde);background:var(--verde-bg);border-color:rgba(10,125,67,.25)}
    .pista{font-size:12px;color:var(--ink-3);margin:-8px 0 14px}
    .pie{text-align:center;font-size:12.5px;color:var(--ink-3);margin:18px 0 0}
    .pie a{color:var(--navy);font-weight:600}
  </style>
</head>
<body>

<main class="card">
  <div class="brand">
    <img src="img/curifor-logo.png" alt="Curifor" width="704" height="158">
    <span>Servicio y Postventa</span>
  </div>

  <h1>Define tu contraseña</h1>
  <p class="sub">Elige una contraseña nueva para entrar a la plataforma.</p>

  <p class="msg" id="aviso" hidden></p>

  <form id="form" novalidate hidden>
    <label for="c1">Contraseña nueva</label>
    <input type="password" id="c1" autocomplete="new-password" minlength="8" required>
    <p class="pista">Mínimo 8 caracteres.</p>

    <label for="c2">Repítela</label>
    <input type="password" id="c2" autocomplete="new-password" minlength="8" required>

    <button class="btn" id="btn" type="submit">Guardar contraseña</button>
  </form>

  <p class="pie" id="pie" hidden>
    <a href="login.html">Ir al acceso interno</a>
  </p>
</main>

<script src="js/agenda-config.js"></script>
<script>
/* ============================================================
   Define la contraseña desde el enlace del correo de recuperación.

   Supabase manda al usuario con el permiso en el ANCLA de la URL
   (#access_token=...), no en la ruta. El ancla no viaja al servidor, así que el
   permiso nunca queda en los registros de GitHub Pages: solo lo ve este script.

   Apenas se lee, se limpia la barra de direcciones. Si el usuario deja la
   pestaña abierta o comparte la pantalla, el enlace ya no sirve para entrar.
   ============================================================ */
(function () {
  "use strict";
  var CFG = window.CURIFOR_AGENDA || {};
  var aviso = document.getElementById("aviso");
  var form = document.getElementById("form");
  var pie = document.getElementById("pie");

  function decir(texto, tipo) {
    aviso.textContent = texto;
    aviso.className = "msg msg--" + (tipo || "err");
    aviso.hidden = false;
  }

  // El permiso viene en el ancla: #access_token=...&type=recovery
  var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var token = h.get("access_token");
  var tipo = h.get("type");
  var errorDesc = h.get("error_description");

  if (errorDesc) {
    decir(decodeURIComponent(errorDesc.replace(/\+/g, " ")) +
          " Pide un enlace nuevo desde el acceso interno.");
    pie.hidden = false;
    return;
  }
  if (!token) {
    decir("Este enlace no es válido o ya caducó. Los enlaces duran una hora: " +
          "pide uno nuevo desde el acceso interno.");
    pie.hidden = false;
    return;
  }
  if (tipo && tipo !== "recovery" && tipo !== "invite") {
    decir("Este enlace no sirve para cambiar la contraseña.");
    pie.hidden = false;
    return;
  }
  if (!CFG.url || !CFG.anonKey) {
    decir("Falta la configuración del sistema. Avísanos y lo revisamos.");
    return;
  }

  // Se saca de la barra de direcciones apenas se tiene en memoria.
  history.replaceState(null, "", location.pathname);
  form.hidden = false;

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var c1 = document.getElementById("c1").value;
    var c2 = document.getElementById("c2").value;
    var btn = document.getElementById("btn");

    if (c1.length < 8) { decir("La contraseña debe tener al menos 8 caracteres."); return; }
    if (c1 !== c2) { decir("Las dos contraseñas no son iguales."); return; }

    btn.disabled = true;
    btn.textContent = "Guardando…";
    aviso.hidden = true;

    fetch(CFG.url + "/auth/v1/user", {
      method: "PUT",
      headers: {
        apikey: CFG.anonKey,
        Authorization: "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password: c1 })
    })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, cuerpo: j }; });
      })
      .then(function (res) {
        if (!res.ok) {
          var m = (res.cuerpo && (res.cuerpo.msg || res.cuerpo.message ||
                   res.cuerpo.error_description)) || "";
          if (/expired|invalid/i.test(m)) {
            decir("El enlace caducó. Pide uno nuevo desde el acceso interno.");
          } else if (/weak|short|6 characters/i.test(m)) {
            decir("Esa contraseña es muy débil. Usa una más larga.");
          } else {
            decir("No se pudo guardar: " + (m || "inténtalo de nuevo"));
          }
          btn.disabled = false;
          btn.textContent = "Guardar contraseña";
          return;
        }
        form.hidden = true;
        decir("Listo. Tu contraseña quedó guardada, ya puedes entrar.", "ok");
        pie.hidden = false;
      })
      .catch(function () {
        decir("No pudimos conectarnos. Revisa tu conexión e inténtalo de nuevo.");
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
      });
  });
})();
</script>
</body>
</html>
